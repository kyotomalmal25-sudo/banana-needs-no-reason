name: Deploy exhibition to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static assets
        env:
          GITHUB_PAGES: "1"
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build -- --prerender-all
      - name: Start production renderer
        run: |
          npm run start -- --port 4173 > /tmp/vinext-pages.log 2>&1 &
          echo $! > /tmp/vinext-pages.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vinext-pages.log
          exit 1
      - name: Capture interactive routes
        run: |
          mkdir -p github-pages-snapshots
          curl --fail --silent --show-error http://127.0.0.1:4173/profile/ -o github-pages-snapshots/profile.html
          curl --fail --silent --show-error http://127.0.0.1:4173/protocol/ -o github-pages-snapshots/protocol.html
          curl --fail --silent --show-error http://127.0.0.1:4173/phone/ -o github-pages-snapshots/phone.html
      - name: Prepare project Pages path
        run: node scripts/prepare-github-pages.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
